name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Keep the build path and Cargo home out of panic strings, and the build path out of the PDB reference.
      # The linker expands %_PDB% itself, so no shell sees it.
      - name: Trim paths
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$cargoHome=cargo -C link-arg=/PDBALTPATH:%_PDB%" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - run: npm ci
      # npm takes the first `--`; tauri passes everything after the second `--` to cargo, so `--locked` reaches cargo.
      - run: npm run tauri build -- -- --locked
      - name: Checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName .
          $hash = (Get-FileHash $exe.Name -Algorithm SHA256).Hash.ToLower()
          # LF line ending, so older sha256sum versions can check the file.
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", "$hash  $($exe.Name)`n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            *-setup.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release
      - name: Verify checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      # Attestations need a public repo on Free/Pro/Team plans; this turns on when the repo goes public.
      - name: Attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*-setup.exe
      - name: Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" *-setup.exe SHA256SUMS.txt --title "QuotaGlass $TAG" --notes "Unsigned Windows installer. Check SHA256SUMS.txt before you run it."
