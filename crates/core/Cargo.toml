[package]
name = "quotaglass-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
# native-tls is Windows SChannel here: no OpenSSL, patched by Windows Update.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
