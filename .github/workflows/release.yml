name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName .
          $hash = (Get-FileHash $exe.Name -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          "EXE=$($exe.Name)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      # Attestations need a public repo on Free/Pro/Team plans; this turns on when the repo goes public.
      - name: Attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.EXE }}
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} ${{ env.EXE }} SHA256SUMS.txt --title "QuotaGlass ${{ github.ref_name }}" --notes "Unsigned Windows installer. Check SHA256SUMS.txt before you run it."
