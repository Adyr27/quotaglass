name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName .
          $hash = (Get-FileHash $exe.Name -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          "EXE=$($exe.Name)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      # Attestations need a public repo on Free/Pro/Team plans; this turns on when the repo goes public.
      - name: Attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.EXE }}
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" "$env:EXE" SHA256SUMS.txt --title "QuotaGlass $env:TAG" --notes "Unsigned Windows installer. Check SHA256SUMS.txt before you run it."
