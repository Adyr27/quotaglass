name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The advisory database is fetched fresh on every run; only the tool binary is cached.
      # To update the tool, change the version in the key and in the install command together.
      - id: audit-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-0.22.2
      - if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --force
      - run: cargo audit
