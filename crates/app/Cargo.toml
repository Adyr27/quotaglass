[package]
name = "quotaglass-app"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
quotaglass-core = { path = "../core" }
iced = { version = "0.14", features = ["wgpu", "tokio", "canvas", "svg"] }
window-vibrancy = "0.8"
raw-window-handle = "0.6"
tray-icon = "0.25"
muda = "0.20"
tauri-winrt-notification = "0.8"
# native-tls is Windows SChannel here: no OpenSSL, patched by Windows Update.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
time = { version = "0.3", features = ["local-offset", "formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
